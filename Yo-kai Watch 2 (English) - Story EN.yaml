# =============================================================================
# Yo-kai Watch 2: Psychic Specters — Archipelago — VERSION 1: STORY ONLY
# -----------------------------------------------------------------------------
# Play the WHOLE STORY up to defeating Dame Demona (end of the adventure).
# The POST-GAME is NOT included in this version.
# Put this file in Archipelago/Players/ then run Generate.
# =============================================================================

name: Player1
description: "Yo-kai Watch 2 (English) - Story (v1)"
game: Yo-kai Watch 2 (English)

requires:
  version: 0.5.0

Yo-kai Watch 2 (English):
  # ---------------------------------------------------------------------------
  # Common Archipelago options
  # ---------------------------------------------------------------------------
  progression_balancing: 50
  accessibility: full
  exclude_locations: []
  priority_locations: []

  # ===========================================================================
  # STORY SECTION (v1) — goal: defeat Dame Demona
  # ===========================================================================
  goal: final_boss                 # v1: end of the story (Dame Demona). Do NOT change.
  logic_difficulty: normal         # casual / normal / hard / expert

  # --- TOGGLEABLE CHECKS (set true or false as you like) ---
  quest_shuffle: true              # requests + services = checks ; ALSO drives the
                                   # in-game display of the AP item on each quest
                                   # (mod patch). false = the mod is left alone.
  chest_shuffle: true              # chests = checks
  tablo_shuffle: true              # Tablo-blabla = checks. ONLY the 19 reverse-engineered
                                   # ones are used; the 7 undetectable ones (6,7,10,23,24,
                                   # 25,26) are excluded automatically. false = no tablo.
                                   # ⚠ Do NOT turn OFF quest_shuffle AND chest_shuffle at
                                   #   the same time: generation fails (pool too small).
  criminel_shuffle: false          # ⛔ DO NOT ENABLE — KEEP ON FALSE.
                                   # Yo-criminal capture milestones (1/5/10/20/30). The
                                   # detection is NOT tested enough: a milestone that never
                                   # fires blocks the run (especially in multiworld, if a
                                   # progression item lands there).

  # NB: BOSSES, story CHAPTERS and watch RANKS are ALWAYS checks, and KEY ITEMS
  #     are ALWAYS in the multiworld pool (cannot be disabled — they are the
  #     backbone of progression).

  # --- MELANGE DES YO-KAI (patch de la ROM) ---
  encounter_shuffle: false        # melange les Yo-kai sauvages de chaque zone
  boss_encounter_shuffle: false   # shuffles BOSS fights among themselves (33 fights,
                                  # mechanics/stuns preserved: the whole fight travels)
  encounter_levels: keep_location # keep_location = le niveau reste sur place
                                  # follow_yokai  = le niveau suit le Yo-kai (chaotique)
                                  # /!\ la ROM .3ds doit etre DECRYPTEE et dans un
                                  #     dossier accessible en ecriture (PAS Program Files).
                                  #     Relancer le jeu apres le patch.

  # --- TRAPS / DEATHLINK ---
  trap_percentage: 0               # v1: NO traps (effect not set up client-side yet)
  death_link: false                # losing a battle = everyone dies (and vice versa:
                                   # a received death drops your wheel to 1 HP). Set true to enable.

  # ===========================================================================
  # POST-GAME SECTION (v2) — NOT IMPLEMENTED: keep everything false / none
  # ---------------------------------------------------------------------------
  # Will become playable once the post-game is done (Wobblewok/Kat Kraydel detection,
  # rank S, Infinite Inferno / Divine Paradise dungeons, legendaries).
  # Post-game goals (infinite_inferno, divine_paradise, all_legendaries,
  # all_checks) are NOT playable yet.
  # ===========================================================================
  ground_item_shuffle: false       # ground items (not detected)
  planque_shuffle: false           # Yo-kai hideouts (not detected)
  komasan_shuffle: false           # Komasan adventures (not detected)
  collection_shuffle: false        # insects / fish
  yokai_shuffle: none              # Yo-kai friendships
  legendary_shuffle: false         # legendary medals (post-game)
  fusion_shuffle: false            # fusion items
  evolution_shuffle: false         # evolutions
