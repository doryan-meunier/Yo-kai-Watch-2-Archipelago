# =============================================================================
# Exemple de YAML pour Yo-kai Watch 2 : Spectres Psychiques (Archipelago)
# -----------------------------------------------------------------------------
# Placez ce fichier dans Archipelago/Players/ puis lancez Generate.
# Chaque option accepte soit une valeur unique, soit une pondération
# (valeur: poids) pour tirer une option au hasard à la génération.
# =============================================================================

name: Doteos            # Votre nom de slot (max 16 caractères, unique)
description: "Yo-kai Watch 2 - exemple complet"
game: Yo-kai Watch 2

requires:
  version: 0.5.0        # Version minimale d'Archipelago

Yo-kai Watch 2:
  # ---------------------------------------------------------------------------
  # Options communes Archipelago
  # ---------------------------------------------------------------------------
  progression_balancing: 50        # 0-99 : lissage de la progression
  accessibility: full              # full / minimal
  local_items: []                  # objets forcés dans votre monde
  non_local_items: []              # objets forcés chez les autres
  start_inventory: {}              # objets de départ (hors pool)
  start_inventory_from_pool: {}    # objets de départ retirés du pool
  start_hints: []                  # indices donnés au départ
  exclude_locations: []            # ex. ["Terror Time - Chest 01"]
  priority_locations: []           # locations forcées en progression

  # ---------------------------------------------------------------------------
  # Général
  # ---------------------------------------------------------------------------
  goal: final_boss                 # final_boss (Lady Démona) / story_100 /
                                   # infinite_inferno (Potofeu, Limbes éternelles) /
                                   # divine_paradise (Filomène) /
                                   # all_legendaries / all_checks
  logic_difficulty: normal         # casual / normal / hard / expert
  starting_region: hauts_de_granval
                                   # hauts_de_granval / quartier_des_boutiques /
                                   # centre_ville / coteau_fleuri / la_corniche

  # ---------------------------------------------------------------------------
  # Pools de locations (qu'est-ce qui est un check ?)
  # ---------------------------------------------------------------------------
  story_shuffle: true              # chapitres = objets "Chapitre d'histoire (progressif)"
  boss_shuffle: true                # 8 boss d'histoire (détectés via Médallium 0x086CFEBC)
  quest_shuffle: true              # les 83 requêtes + 10 services du guide
  chest_shuffle: true              # chaque coffre est un check
  ground_item_shuffle: false        # chaque objet au sol est un check
  planque_shuffle: false            # les 52 planques Yo-kai
  tablo_shuffle: true               # Tablo-blabla : SEULS les 19 RE'd sont pris en compte
                                   #   (les 7 non détectables sont exclus d'office)
  komasan_shuffle: false            # les 9 aventures de Komasan
  criminel_shuffle: false          # ⛔ NE PAS ACTIVER : détection pas assez testée
  collection_shuffle: false        # 84 insectes et poissons (grind !)
  yokai_shuffle: none              # none / s_rank / legendary / all
  legendary_shuffle: false         # médailles légendaires dans le pool
  fusion_shuffle: false            # les 18 objets de fusion = checks
  evolution_shuffle: false         # évolutions notables = checks

  # ---------------------------------------------------------------------------
  # Objets
  # ---------------------------------------------------------------------------
  key_item_shuffle: true           # objets clés dans le pool multiworld
  progressive_watch_rank: true     # 5x "Progressive Watch Rank" (sinon D/C/B/A/S)
  progressive_bicycle: false       # 2x "Progressive Bicycle" (sinon "Bicycle")
  early_bicycle: true              # vélo garanti tôt dans le multiworld
  early_watch_upgrade: false       # premier rang de montre garanti tôt

  # ---------------------------------------------------------------------------
  # Pièges et divers
  # ---------------------------------------------------------------------------
  trap_percentage: 10              # 0-100 : % de filler remplacé par des pièges
  death_link: false                # partage des morts avec les autres joueurs

  # Exemple de pondération aléatoire :
  # logic_difficulty:
  #   normal: 50
  #   hard: 40
  #   expert: 10
